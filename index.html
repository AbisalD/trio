// Service worker (solo con http/https): sin conexión y actualización automática
(function () {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  let pending = false;
  const canReload = () => typeof G === 'undefined' || G.state !== 'play' || G.overlay === 'win' || G.overlay === 'lose';
  const tryReload = () => { if (pending && canReload()) { pending = false; location.reload(); } };
  setInterval(tryReload, 1500);
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    const sw = navigator.serviceWorker.controller; if (!sw) return;
    const ch = new MessageChannel();
    // solo se recarga si el service worker nuevo trae otra versión (la primera instalación coincide)
    ch.port1.onmessage = ev => { if (ev.data && ev.data !== window.TRIO_VERSION) { pending = true; tryReload(); } };
    sw.postMessage('version', [ch.port2]);
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(reg => {
      const check = () => reg.update().catch(() => {});
      check(); // cada vez que se abre: comprobar si hay versión nueva
      document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
      setInterval(check, 30 * 60 * 1000);
    }).catch(() => {});
  });
})();

/* ------------------------- CONFIGURACIÓN ------------------------- */

/* =============================== AUDIO ===============================

const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  return new Promise((res, rej) => {
    c.oncomplete = e => res(e.renderedBuffer);
    const p = c.startRendering();
    if (p && p.then) p.then(res, rej);

/* --------------------------- INSTRUMENTOS --------------------------- */
function vMarimba(c, d, t, f, g, dur) {
  tone(c, d, { t, f, g, dur: dur || 0.9, a: 0.003 });
  tone(c, d, { t, f: f * 4, g: g * 0.22, dur: 0.12, a: 0.002 });
  tone(c, d, { t, f: f * 9.8, g: g * 0.05, dur: 0.03, a: 0.001 });
}
function vKalimba(c, d, t, f, g, dur) {
  tone(c, d, { t, f, g, dur: dur || 1.4, a: 0.003 });
  tone(c, d, { t, f: f * 2.0, g: g * 0.25, dur: 0.5, a: 0.003, det: 4 });
  tone(c, d, { t, f: f * 5.4, g: g * 0.07, dur: 0.07, a: 0.001 });
}
function vEP(c, d, t, f, g, dur) {
  tone(c, d, { t, f, g: g * 0.8, dur: dur || 1.2, a: 0.006, type: 'triangle', lp: 2000 });
  tone(c, d, { t, f: f * 2, g: g * 0.16, dur: 0.4, a: 0.004 });
  tone(c, d, { t, f: f * 1.004, g: g * 0.5, dur: dur || 1.2, a: 0.01 });
}
function vPluck(c, d, t, f, g, dur) {
  tone(c, d, { t, f, g, dur: dur || 0.7, a: 0.002, type: 'triangle', lp: 3200 });
  tone(c, d, { t, f: f * 2.003, g: g * 0.2, dur: 0.25, a: 0.002 });
}
function vPad(c, d, t, f, g, dur) {
  for (const det of [-9, 0, 8]) {
    const s = c.createOscillator(); s.type = 'sawtooth'; s.frequency.value = f; s.detune.value = det;
    const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 850; fl.Q.value = 0.4;
    const gg = c.createGain();
    gg.gain.setValueAtTime(0.0001, t); gg.gain.linearRampToValueAtTime(g, t + 0.6);
    gg.gain.setValueAtTime(g, t + dur - 0.2); gg.gain.linearRampToValueAtTime(0.0001, t + dur + 0.6);
    s.connect(fl); fl.connect(gg); gg.connect(d); s.start(t); s.stop(t + dur + 0.7);

/* ------------------------------ MÚSICA ------------------------------ */
// Un tema por escenario: [bajo, [notas del acorde]] y escala (clases de tono)
const TRACKS = [

  { bpm: 84, swing: 0.03, lead: vPluck, arp: vPluck, seed: 52, scale: [9, 0, 2, 4, 7], drums: 0.55, padG: 0.024,

function genMelody(T, rnd) {
  const pool = []; for (let m = 64; m <= 86; m++) if (T.scale.includes(m % 12)) pool.push(m);
  const nearest = (m, pcs) => { let best = 0, bd = 1e9; for (let i = 0; i < pool.length; i++) { if (pcs && !pcs.includes(pool[i] % 12)) continue; const dd = Math.abs(pool[i] - m); if (dd < bd) { bd = dd; best = i; } } return best; };

    const ph = []; let cur = nearest(74);
    for (let s = 0; s < 16; s++) {
      const chord = T.chords[(startBar + (s >> 3)) % T.chords.length][1].map(m => m % 12);
      const strong = s % 4 === 0;
      const p = ending && s >= 12 ? (s === 12 ? 1 : 0) : strong ? 0.78 : (s % 2 ? 0.28 : 0.5);

// Cada nota distinta (instrumento + altura + duración) se sintetiza UNA vez con su

      if (intro && i % 2 && b < 2) continue;

      note(T.arp, arpN, m, 0.8, 1.6, t0 + i * e8 + sw(i), i % 2 ? 0.045 : 0.065, -0.28, 0.45);
    }
    if (b >= 4) {
      for (const [s, iv, beats] of [[0, 0, 1.5], [3, 12, 0.5], [4, 0, 1], [6, 7, 1]]) { const d = beats * beat * 0.95; note(vBass, 'bass', root + iv, d, d + 0.1, t0 + s * e8 + sw(s), 0.22, 0, 0.05); }

  const voices = new Map(), list = [...uniq.values()];

    const bufs = await Promise.all(part.map(e => renderOffline(e.len, 1, rate, e.fn).catch(() => null)));

  // 2) mezcla en JS
  const dL = new Float32Array(N), dR = new Float32Array(N), wL = new Float32Array(N), wR = new Float32Array(N);
  let mixed = 0;
  for (const e of ev) {
    if (++mixed % 40 === 0) await sleep(0);
    const v = voices.get(e.key); if (!v) continue;
    const s0 = Math.round(e.t * rate), a = (e.pan + 1) * Math.PI / 4, gL = e.g * Math.cos(a) * 1.41, gR = e.g * Math.sin(a) * 1.41;

  const buf = await renderOffline(loopLen + tail, 2, rate, (c, d) => {

}
function foldLoop(buf, loopLen, rate) {
  const L = Math.floor(loopLen * rate), ch = buf.numberOfChannels;
  const out = AUDIO.ctx.createBuffer(ch, L, rate);
  let peak = 0;
  for (let k = 0; k < ch; k++) {
    const src = buf.getChannelData(k), dst = out.getChannelData(k);
    dst.set(src.subarray(0, L));
    for (let i = L; i < src.length; i++) dst[i - L] += src[i];
    for (let i = 0; i < L; i++) { const a = dst[i] < 0 ? -dst[i] : dst[i]; if (a > peak) peak = a; }

  const norm = peak > 0 ? 0.85 / peak : 1;
  for (let k = 0; k < ch; k++) { const dst = out.getChannelData(k); for (let i = 0; i < L; i++) dst[i] *= norm; }
  return out;
}

const AUDIO = {
  ctx: null, master: null, musicBus: null, sfxBus: null, buf: {}, sfxReady: false, active: 0,
  mus: { cur: null, curIdx: -1, wantIdx: -1, cache: new Map(), busy: false },
  init() {
    if (this.ctx) { this.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { try { this.ctx = new AC(); } catch (e2) { return; } }
    const c = this.ctx;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.2;
    comp.connect(c.destination);
    this.master = c.createGain(); this.master.gain.value = 0.9; this.master.connect(comp);
    this.musicBus = c.createGain(); this.musicBus.connect(this.master);
    this.sfxBus = c.createGain(); this.sfxBus.connect(this.master);
    this.applyVolumes();
    this.resume();
    // iOS: un búfer mudo dentro del gesto termina de desbloquear el audio
    try { const b = c.createBuffer(1, 1, c.sampleRate), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { /* sin efecto */ }
    this.prepareSfx();
  },
  applyVolumes() {
    if (!this.ctx) return; const t = this.ctx.currentTime;
    this.musicBus.gain.setTargetAtTime(STORE.d.music ? CFG.MUSIC_VOL : 0, t, 0.08);
    this.sfxBus.gain.setTargetAtTime(STORE.d.sfx ? CFG.SFX_VOL : 0, t, 0.03);
  },
  async prepareSfx() {
    const order = ['click', 'pick', 'land', 'match', 'intro', 'blocked', 'whoosh', 'danger', 'heart', 'combo', 'tick', 'chain', 'boom', 'undo', 'pop', 'magnet', 'shuffle', 'star', 'win', 'lose'];
    for (const n of order) {
      try { this.buf[n] = await renderOffline(SFX[n].dur, 1, this.ctx.sampleRate, SFX[n].fn); } catch (e) { /* sin este efecto */ }
      await sleep(0);
    }
    this.sfxReady = true;
    if (this.mus.wantIdx >= 0) this.playMusic(this.mus.wantIdx);
  },
  play(name, opt) {
    if (!this.ctx || !STORE.d.sfx || this.ctx.state !== 'running') return;
    const b = this.buf[name]; if (!b || this.active > 14) return;
    const c = this.ctx, s = c.createBufferSource(); s.buffer = b;
    if (opt && opt.rate) s.playbackRate.value = opt.rate;
    const g = c.createGain(); g.gain.value = opt && opt.vol != null ? opt.vol : 1;
    s.connect(g); g.connect(this.sfxBus);

    s.start();
  },
  setMusic(idx) { this.mus.wantIdx = idx; if (this.ctx && this.sfxReady) this.playMusic(idx); },
  async playMusic(idx) {
    const m = this.mus;
    if (m.curIdx === idx && m.cur) return;
    if (m.busy) return;
    let buf = m.cache.get(idx);
    if (!buf) {
      m.busy = true;
      try { buf = await renderTrack(idx); } catch (e) { buf = null; }
      m.busy = false;
      if (buf) { m.cache.set(idx, buf); for (const k of [...m.cache.keys()]) if (m.cache.size > 2 && k !== idx && k !== m.curIdx) m.cache.delete(k); }
      if (m.wantIdx !== idx) { this.playMusic(m.wantIdx); return; }
    }
    if (!buf) return;
    const c = this.ctx, t = c.currentTime;
    if (m.cur) { const old = m.cur; old.g.gain.setTargetAtTime(0, t, 0.4); try { old.s.stop(t + 2.5); } catch (e) {} }
    const s = c.createBufferSource(); s.buffer = buf; s.loop = true;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.setTargetAtTime(1, t + 0.05, 0.6);

  },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {}); },
  resume() { if (this.ctx && this.ctx.state !== 'running') this.ctx.resume().catch(() => {}); },

const COMBO_WORDS = [[3, '¡BIEN!'], [5, '¡GENIAL!'], [8, '¡BRUTAL!'], [12, '¡IMPARABLE!'], [16, '¡LEYENDA!']];

      R.rewards.forEach((k2, i) => { const px = cx + (i - (n - 1) / 2) * (sz + 50); x.drawImage(pwSprite(k2, Math.round(sz * S), true), px - sz / 2, ly + 18, sz, sz); txt(x, '+1', px + sz * 0.56, ly + 50, 28, '#2a7a18', 'left', 900); });
    }
  }
  x.restore();
  x.globalAlpha = a;
  for (const b of UI.btns) drawBtn(x, b);
  x.globalAlpha = 1;
}
let DT = 0.016;
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bgCanvas(G.world, G.variant, canvas.width, canvas.height, S), 0, 0);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  drawAmb(ctx, DT);
  if (G.state === 'title') { drawTitle(ctx); for (const b of UI.btns) drawBtn(ctx, b); FX.draw(ctx); }
  else if (G.state === 'levels') { drawLevels(ctx); for (const b of UI.btns) drawBtn(ctx, b); }
  else if (G.state === 'play') {
    drawPlay(ctx);
    if (G.dangerOn && !G.overlay) { ctx.globalAlpha = (logicalCount() >= CFG.TRAY_SLOTS - 1 ? 0.75 : 0.45) * (0.65 + 0.35 * Math.sin(G.t * 7)); ctx.drawImage(vignetteSprite('#c80a00'), 0, 0, VW, VH); ctx.globalAlpha = 1; }
    if (!G.overlay) { for (const b of UI.btns) drawBtn(ctx, b); FX.draw(ctx); drawAnnounce(ctx); drawIntro(ctx); }
    else {
      PW_KEYS.forEach((k, i) => drawBtn(ctx, mkBtn(Object.assign({ kind: 'pw', pw: k }, pwBtnRect(i)))));
      drawOverlay(ctx);
    }
    if (G.flash > 0) { ctx.globalAlpha = Math.min(0.6, G.flash); ctx.fillStyle = G.flashCol; ctx.fillRect(-10, -10, VW + 20, VH + 20); ctx.globalAlpha = 1; }
  }
}

/* ============================ ARRANQUE ============================ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let timeScale = 1;

// Áreas seguras (muesca, isla dinámica, barra de inicio): se leen de env(safe-area-inset-*)
// mediante un elemento sonda; el juego se encaja dentro y el fondo cubre toda la pantalla.
function safeInsets() {
  let s = { t: 0, r: 0, b: 0, l: 0 };
  const el = document.getElementById('safe');
  if (el) { const cs = getComputedStyle(el), f = v => parseFloat(v) || 0; s = { t: f(cs.paddingTop), r: f(cs.paddingRight), b: f(cs.paddingBottom), l: f(cs.paddingLeft) }; }
  if (TEST) { const m = /[?&]safe=([\d.,]+)/.exec(location.search); if (m) { const a = m[1].split(',').map(Number); s = { t: a[0] || 0, r: a[1] || 0, b: a[2] || 0, l: a[3] || 0 }; } }
  return s;
}
let SAFE = { t: 0, r: 0, b: 0, l: 0 };
function resize() {
  const cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
  SAFE = safeInsets();
  const aw = Math.max(1, cw - SAFE.l - SAFE.r), ah = Math.max(1, ch - SAFE.t - SAFE.b);
  // Siempre vertical: 1000 de ancho lógico; en pantallas apaisadas se muestra una columna de móvil centrada
  VW = 1000; VH = ah > aw ? clamp(1000 * ah / aw, 1500, 2300) : 1780;
  let dpr = Math.min(window.devicePixelRatio || 1, CFG.MAX_DPR);
  if (cw * ch * dpr * dpr > CFG.MAX_BACKING_PIXELS) dpr = Math.sqrt(CFG.MAX_BACKING_PIXELS / (cw * ch));
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  CSSK = canvas.width / cw;
  S = Math.min(aw * CSSK / VW, ah * CSSK / VH);
  OX = SAFE.l * CSSK + (aw * CSSK - VW * S) / 2; OY = SAFE.t * CSSK + (ah * CSSK - VH * S) / 2;
  artReset(); layout();
  if (G.lvl) boardGeometry();
  buildUI();
}
function toV(e) { const r = canvas.getBoundingClientRect(); return { x: ((e.clientX - r.left) * CSSK - OX) / S, y: ((e.clientY - r.top) * CSSK - OY) / S }; }
function tileAt(px, py) {
  const pad = G.tileW * CFG.HIT_PAD;
  for (let i = G.draw.length - 1; i >= 0; i--) {
    const t = G.draw[i]; if (!t.alive || t.ret) continue;
    if (px >= t.sx - pad && px <= t.sx + G.tileW + pad && py >= t.sy - pad && py <= t.sy + G.tileW + pad) return t;
  }
  return null;
}
function tapPlay(p) {
  if (G.entering || G.lost || G.overlay || G.winT >= 0) return;
  for (let i = 0; i < CFG.HOLD_SLOTS; i++) { const h = G.hold[i]; if (!h) continue; const q = holdPos(i), s = L.holdSlot / 2; if (Math.abs(p.x - q.x) <= s && Math.abs(p.y - q.y) <= s) { takeFromHold(i); return; } }
  const t = tileAt(p.x, p.y); if (!t) return;
  if (t.free) pickTile(t); else blockedTap(t);
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  AUDIO.init();
  const p = toV(e);
  const b = hitBtn(p);
  if (b) { if (b.en()) { b.pr = 1; UI.press = b; } return; }
  if (G.state === 'play') tapPlay(p);
}, { passive: false });
window.addEventListener('pointerup', e => {
  const b = UI.press; if (!b) return; UI.press = null; b.pr = 0;
  const p = toV(e);
  if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h && b.en()) { AUDIO.play('click'); b.on(); }
});
canvas.addEventListener('pointermove', e => {
  const p = toV(e);
  if (UI.press) { const b = UI.press; b.pr = p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h ? 1 : 0; }
  if (e.pointerType === 'mouse' && G.state === 'play' && !G.overlay) { const t = tileAt(p.x, p.y); G.hover = t && t.free ? t : null; canvas.style.cursor = (t && t.free) || hitBtn(p) ? 'pointer' : 'default'; }
  else canvas.style.cursor = hitBtn(p) ? 'pointer' : 'default';
});
canvas.addEventListener('pointerleave', () => { G.hover = null; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', resize);
window.addEventListener('keydown', e => { // auxiliar: Esc = pausa
  if (e.key === 'Escape' && G.state === 'play') { if (!G.overlay) openOverlay('pause'); else if (G.overlay === 'pause') closeOverlay(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (G.state === 'play' && !G.overlay && G.winT < 0) openOverlay('pause'); AUDIO.suspend(); }
  else AUDIO.resume();
});

function update(dt) {
  G.t += dt; DT = dt;
  for (const k in UI.nudges) UI.nudges[k] = Math.max(0, UI.nudges[k] - dt);
  if (G.state === 'play') {
    if (G.overlay !== 'pause') updateGame(dt);
    if (G.overlay) {
      const prev = G.overlayT; G.overlayT += dt;
      if (G.overlay === 'win' && G.result) for (let i = 0; i < G.result.stars; i++) { const t0 = 0.35 + i * 0.32; if (prev < t0 && G.overlayT >= t0) AUDIO.play('star', { rate: 1 + i * 0.12 }); }
    }
  }
  FX.update(dt);
}
let last = performance.now();
const PERF = { frames: 0, acc: 0 };
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(Math.max(dt, 0), 0.1) * timeScale;
  update(dt);
  const t0 = performance.now(); render(); PERF.acc += performance.now() - t0; PERF.frames++;
}

STORE.load();
FX.init();
setWorld((Math.random() * WORLDS.length) | 0, (Math.random() * 3) | 0);
initTitleTiles();
resize();
requestAnimationFrame(frame);

/* ------------------------- GANCHOS DE PRUEBA ------------------------- */
if (TEST) {
  window.T = {
    G, STORE, AUDIO, L, FX,
    go(n, opt) { G.mode = opt ? 'rand' : 'camp'; startLevel(n, opt); G.entering = false; G.introT = 9; G.boardDirty = true; },
    skipIntro() { G.entering = false; G.introT = 9; G.boardDirty = true; },
    title: goTitle,
    levels() { G.state = 'levels'; G.levelPage = 0; buildUI(); },
    speed(k) { timeScale = k; },
    freeTiles() { return G.tiles.filter(t => t.alive && t.free && !t.ret); },
    // jugada de un jugador sensato: completar tríos, luego emparejar, luego lo más repetido entre las libres
    smartPick() {
      const free = this.freeTiles(); if (!free.length) return null;
      const cnt = {}; for (const o of G.tray) if (live(o)) cnt[o.type] = (cnt[o.type] || 0) + 1;
      const fc = {}; for (const t of free) fc[t.type] = (fc[t.type] || 0) + 1;
      let best = null, bs = -1e9;
      for (const t of free) {
        const c = cnt[t.type] || 0; let s = c * 10 + (fc[t.type] || 0) * 3 + t.z * 0.5;
        if (c + fc[t.type] >= 3) s += 20;
        if (s > bs) { bs = s; best = t; }
      }
      return best;
    },
    tapTile(t) { const p = { x: t.sx + G.tileW / 2, y: t.sy + G.tileW / 2 }; tapPlay(p); },
    tileCenterCss(t) { const r = canvas.getBoundingClientRect(); return { x: r.left + ((t.sx + G.tileW / 2) * S + OX) / CSSK, y: r.top + ((t.sy + G.tileW / 2) * S + OY) / CSSK }; },
    btnCss(pred) { const b = UI.btns.find(pred); if (!b) return null; const r = canvas.getBoundingClientRect(); return { x: r.left + ((b.x + b.w / 2) * S + OX) / CSSK, y: r.top + ((b.y + b.h / 2) * S + OY) / CSSK }; },
    stats() { return { state: G.state, overlay: G.overlay, n: G.n, total: G.total, removed: G.removed, tray: G.tray.map(o => o.type + ':' + o.state), lost: G.lost, winT: G.winT, score: G.score, unlocked: STORE.d.unlocked, pw: Object.assign({}, STORE.d.pw), sfx: Object.keys(AUDIO.buf).length, music: AUDIO.mus.curIdx, perf: PERF.frames ? PERF.acc / PERF.frames : 0 }; },
    resetPerf() { PERF.frames = 0; PERF.acc = 0; },
    simulate(n, opt) { const lv = buildLevel(n, opt); const g = greedyRun(lv.tiles); return { n, ok: g.ok, maxTray: g.maxTray, total: lv.tiles.length, layers: lv.layers, types: lv.nTypes, shape: lv.shape, world: WORLDS[lv.world].id, mods: Object.keys(lv.mods).join('+'), target: lv.target, diff: lv.diff, time: lv.timeLimit }; },
    followOrder(n, opt) {
      const lv = buildLevel(n, opt), cnt = {}; let inT = 0, maxTray = 0, trios = 0, picks = 0;
      for (const id of lv.order) {
        const t = lv.tiles[id];
        if (!t.above.every(b => !b.alive)) return { n, ok: false, why: 'tapada' };
        if (t.lock > trios) return { n, ok: false, why: 'cadena' };
        t.alive = false; picks++; cnt[t.type] = (cnt[t.type] || 0) + 1; inT++;
        if (cnt[t.type] === 3) { cnt[t.type] = 0; inT -= 3; trios++; }
        maxTray = Math.max(maxTray, inT); if (inT >= 7) return { n, ok: false, why: 'bandeja' };
        for (const b of lv.tiles) if (b.alive && b.bomb && picks >= b.bomb) return { n, ok: false, why: 'bomba' };
      }
      return { n, ok: true, maxTray, total: lv.tiles.length };
    },
  };
}

/* ===================== AJUSTES DE PLATAFORMA (iPhone/web) =====================
   Sin zoom por gestos ni doble toque, sin rebote, sin menú de mantener pulsado;
   audio desbloqueado en el primer toque y reanudado al volver; guardado persistente;
   aviso «Gira el móvil» si un teléfono está en horizontal (el juego es vertical).
   ============================================================================ */
(function platform() {
  const stop = e => { if (e.cancelable) e.preventDefault(); };
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick']) document.addEventListener(ev, stop, { passive: false });
  document.addEventListener('touchmove', stop, { passive: false });
  canvas.addEventListener('touchstart', stop, { passive: false });
  canvas.addEventListener('touchend', stop, { passive: false });
  document.addEventListener('selectstart', stop);
  // audio: iOS arranca el AudioContext suspendido; se crea/reanuda en el gesto
  let asked = false;
  const unlock = () => {
    AUDIO.init(); AUDIO.resume();
    if (!asked) { asked = true; try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* sin efecto */ } }
  };
  for (const ev of ['pointerdown', 'touchend', 'click', 'keydown']) window.addEventListener(ev, unlock, { capture: true, passive: true });
  const back = () => { if (!document.hidden) { AUDIO.resume(); setTimeout(resize, 60); } };
  window.addEventListener('pageshow', back); window.addEventListener('focus', back);
  // cambio de orientación: iOS informa del tamaño nuevo con retraso
  window.addEventListener('orientationchange', () => { setTimeout(resize, 120); setTimeout(resize, 450); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', () => setTimeout(resize, 30));
  // aviso de girar: lo muestra el CSS; aquí solo se pausa la partida mientras se ve
  const mq = window.matchMedia ? window.matchMedia('(orientation: landscape) and (pointer: coarse) and (max-height: 540px)') : null;
  const onRot = () => { if (mq && mq.matches && G.state === 'play' && !G.overlay && G.winT < 0) openOverlay('pause'); };
  if (mq) { if (mq.addEventListener) mq.addEventListener('change', onRot); else if (mq.addListener) mq.addListener(onRot); onRot(); }
  setInterval(onRot, 1000);
})();
